[project]
name = "hindsight"
version = "0.1.0"
description = "Incident-response agent crew with shared graph memory on FalkorDB"
requires-python = ">=3.12"
dependencies = [
  "falkordb>=1.0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-ulid>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
